<nav class="paginacao" aria-label="{{ rotulo }}">
  <ul class="paginacao__lista">
    <!-- ng-disabled tira o botão da ordem de Tab quando não há página anterior. -->
    <li class="paginacao__item">
      <button type="button" class="paginacao__botao" aria-label="Página anterior"
              ng-disabled="paginaAtual <= 1" ng-click="anterior()">Anterior</button>
    </li>
    <!-- track by p: o botão de cada página é reaproveitado e o foco não se perde. -->
    <li class="paginacao__item" ng-repeat="p in paginas track by p">
      <button type="button" class="paginacao__botao" aria-label="Página {{ p }}"
              ng-class="{ 'paginacao__botao--atual': p === paginaAtual }"
              ng-attr-aria-current="{{ p === paginaAtual ? 'page' : undefined }}"
              ng-click="ir(p)">{{ p }}</button>
    </li>
    <li class="paginacao__item">
      <button type="button" class="paginacao__botao" aria-label="Próxima página"
              ng-disabled="paginaAtual >= totalPaginas" ng-click="proxima()">Próxima</button>
    </li>
  </ul>
</nav>
